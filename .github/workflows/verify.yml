name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'full' || 'changes' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.plan.outputs.base }}
      full: ${{ steps.plan.outputs.full }}
      checks: ${{ steps.plan.outputs.checks }}
      browser: ${{ steps.plan.outputs.browser }}
      postgres: ${{ steps.plan.outputs.postgres }}
      performance: ${{ steps.plan.outputs.performance }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - id: plan
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          echo "base=$CHANGE_BASE" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = true ]; then
            printf 'full=true\nchecks=true\nbrowser=true\npostgres=true\nperformance=true\n' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
            node scripts/verify-changes.js --base "$CHANGE_BASE" --dry-run --github-output "$GITHUB_OUTPUT"
            node scripts/check-range-whitespace.js "$CHANGE_BASE"
          fi
      - id: matrix
        env:
          FULL: ${{ steps.plan.outputs.full }}
          VISUAL: ${{ steps.plan.outputs.visual }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const include = process.env.FULL === 'true' ? [
            { name: 'chromium-small', browser: 'chromium', projects: '--project=chromium-360x640 --project=chromium-390x844' },
            { name: 'chromium-large', browser: 'chromium', projects: '--project=chromium-412x915 --project=chromium-844x390' },
            { name: 'webkit', browser: 'webkit', projects: '--project=webkit-390x844' }
          ] : [{ name: 'chromium-small', browser: process.env.VISUAL === 'true' ? 'chromium webkit' : 'chromium', projects: '' }];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  fast:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Relevant checks
        if: needs.changes.outputs.full != 'true'
        env:
          CHANGE_BASE: ${{ needs.changes.outputs.base }}
        run: node scripts/verify-changes.js --base "$CHANGE_BASE" --phase checks
      - name: Full release checks
        if: needs.changes.outputs.full == 'true'
        run: npm run verify:fast && npm run build:outputs && npm run smoke:built && npm run check:identity-bundles && npm run check:reward-security && npm audit

  browser-quality:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Relevant browser specs
        if: needs.changes.outputs.full != 'true'
        env:
          CHANGE_BASE: ${{ needs.changes.outputs.base }}
        run: node scripts/verify-changes.js --base "$CHANGE_BASE" --phase browser
      - name: Full release browser matrix
        if: needs.changes.outputs.full == 'true'
        run: node scripts/run-playwright.js --quality-gate --quality-shard ${{ matrix.projects }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-evidence-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  performance-bundle:
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser:performance
      - name: Measure the fresh client bundle
        if: always()
        run: npm run check:bundle-budget
      - name: Upload sanitized performance and bundle measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-bundle-measurements-${{ github.run_id }}
          path: |
            test-results/wp014-bundle.json
            test-results/wp014-performance.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload performance or bundle failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: performance-bundle-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  postgres-reward-security:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WP014_TEST_DATABASE_URL: postgresql://nimble_knots_test:nimble_knots_test@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_USER: nimble_knots_test
          POSTGRES_PASSWORD: nimble_knots_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimble_knots_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:reward:postgres
      - run: npm run test:browser:reward:postgres
      - run: npm run check:identity-bundles
      - run: npm run check:reward-security
      - name: Upload PostgreSQL reward failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: postgres-reward-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
