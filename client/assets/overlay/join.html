<main class="screen-shell">
    <header class="brand-lockup">
        <p class="eyebrow">Cotton Clash</p>
        <h1>NIMble Knots</h1>
        <p class="tagline">Soft heroes. Epic clashes.</p>
    </header>
    <div class="action-stack">
        <div class="action-row">
            <label class="visually-hidden" for="inp-room">Clash code</label>
            <input type="text" id="inp-room" placeholder="Clash code">
            <button id="b-join">Join Clash</button>
        </div>
        <button class="secondary" id="b-rand">Find a Clash</button>
        <button class="quiet" id="b-back">Rejoin Last Clash</button>
    </div>
</main>
